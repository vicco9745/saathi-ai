<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Chat</title>
    <style>
        /* ── CSS Variables ── */
        :root {
            --bg: #ffffff;
            --page-bg: #f6f7f9;
            --text: #1a1a2e;
            --text-soft: #6b6b80;
            --text-muted: #8e8ea0;
            --border: #eaeef2;
            --accent: #10a37f;
            --accent-hover: #0d8b6c;
            --accent-soft: #e6f7f1;
            --danger: #e5484d;
            --panel-bg: #ffffff;
            --panel-shadow: 0 12px 40px rgba(0, 0, 0, .10);
            --composer-bg: #ffffff;
            --topbar-bg: #ffffff;
            --icon-hover: #f0f2f5;
            --icon-circle-bg: #f0f2f5;
            --action-bg: #1a1a2e;
            --action-color: #ffffff;
            --action-hover: #2d2d44;
            --call-bg: #0d0d0f;
            --call-text: #ececec;
            --call-circle-bg: #2a2a32;
            --attach-menu-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, .04);
        }

        [data-theme="dark"] {
            --bg: #1a1a1e;
            --page-bg: #121216;
            --text: #ececf0;
            --text-soft: #9a9aaa;
            --text-muted: #7a7a8a;
            --border: #2e2e38;
            --accent: #10a37f;
            --accent-hover: #0d8b6c;
            --accent-soft: #1a2e28;
            --panel-bg: #18181e;
            --panel-shadow: 0 12px 40px rgba(0, 0, 0, .5);
            --composer-bg: #1a1a20;
            --topbar-bg: #16161c;
            --icon-hover: #2a2a34;
            --icon-circle-bg: #2a2a34;
            --action-bg: #2a2a34;
            --action-color: #ececf0;
            --action-hover: #3a3a46;
            --attach-menu-bg: #1a1a20;
            --shadow-color: rgba(0, 0, 0, .3);
        }

        /* ── Reset & Base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        button {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            appearance: none;
            font-family: inherit;
        }
        button:active {
            transform: scale(0.94);
            opacity: 0.75;
            transition: transform .1s ease, opacity .1s ease;
        }
        html,
        body {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: background .3s, color .3s;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }

        /* ── Top Bar (NO title text, NO bottom border) ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--topbar-bg);
            flex-shrink: 0;
            transition: background .3s;
            position: relative;
            z-index: 20;
        }

        /* ── Round icon buttons WITH circular background ── */
        .icon-btn {
            border: none;
            background: var(--icon-circle-bg);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text);
            transition: background .2s, color .2s, transform .15s;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: var(--border);
            transform: scale(1.06);
        }
        .icon-btn svg {
            width: 19px;
            height: 19px;
        }

        .right-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        /* ── Top bar dropdown menu (three-dot) ── */
        .topbar-menu-wrap {
            position: relative;
        }
        .topbar-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 218px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .16);
            padding: 6px;
            display: none;
            flex-direction: column;
            z-index: 60;
        }
        .topbar-menu.open {
            display: flex;
            animation: menuPop .16s ease;
        }
        @keyframes menuPop {
            from { opacity: 0; transform: translateY(-6px) scale(.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .topbar-menu button {
            display: flex;
            align-items: center;
            gap: 12px;
            border: none;
            background: transparent;
            padding: 10px 12px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            transition: background .15s;
        }
        .topbar-menu button:hover {
            background: var(--icon-hover);
        }
        .topbar-menu button svg {
            width: 17px;
            height: 17px;
            color: var(--text-soft);
            flex-shrink: 0;
        }
        .topbar-menu button.danger {
            color: var(--danger);
        }
        .topbar-menu button.danger svg {
            color: var(--danger);
        }
        .topbar-menu button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
        .topbar-menu .menu-divider {
            height: 1px;
            background: var(--border);
            margin: 5px 8px;
        }

        /* ── Chat Drawer ── */
        .chat-panel {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(320px, 84vw);
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            box-shadow: var(--panel-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 40;
            transform: translateX(-100%);
            transition: transform .28s cubic-bezier(.22, 1, .36, 1), background .3s, border-color .3s;
        }
        .chat-panel.open {
            transform: translateX(0);
        }
        .chat-panel-header {
            padding: 18px 16px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-panel-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.4px;
        }
        .new-chat-pill {
            margin: 8px 16px 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            background: transparent;
            padding: 11px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: background .2s, border-color .3s, color .3s;
        }
        .new-chat-pill:hover {
            background: var(--icon-hover);
        }
        .new-chat-pill svg {
            width: 18px;
            height: 18px;
        }

        /* ── Search box in drawer ── */
        .chat-search-wrap {
            margin: 8px 16px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--bg);
            transition: border-color .2s, background .3s;
        }
        .chat-search-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, .10);
        }
        .chat-search-wrap svg {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .chat-search-wrap input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
        }
        .chat-search-wrap input::placeholder {
            color: var(--text-muted);
        }
        .chat-search-clear {
            border: none;
            background: transparent;
            color: var(--text-muted);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .chat-search-clear.show {
            display: flex;
        }
        .chat-search-clear svg {
            width: 12px;
            height: 12px;
        }

        /* ── Model selector under search box ── */
        .model-selector {
            margin: 6px 16px 2px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--bg);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background .2s, border-color .2s;
        }
        .model-selector:hover {
            background: var(--icon-hover);
        }
        .model-selector .model-icon {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .model-selector .model-icon svg {
            width: 14px;
            height: 14px;
        }
        .model-selector .model-info {
            flex: 1;
            min-width: 0;
        }
        .model-selector .model-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-bottom: 1px;
        }
        .model-selector .model-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .model-selector .model-caret {
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .model-selector .model-caret svg {
            width: 16px;
            height: 16px;
            transition: transform .2s;
        }
        .model-selector.open .model-caret svg {
            transform: rotate(180deg);
        }

        .model-list {
            margin: 4px 16px 4px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--bg);
            padding: 5px;
            display: none;
            flex-direction: column;
            gap: 2px;
        }
        .model-list.open {
            display: flex;
            animation: menuPop .16s ease;
        }
        .model-list button {
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            background: transparent;
            padding: 9px 11px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            transition: background .15s;
        }
        .model-list button:hover {
            background: var(--icon-hover);
        }
        .model-list button.selected {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .model-list button .check {
            margin-left: auto;
            color: var(--accent);
            display: none;
        }
        .model-list button.selected .check {
            display: flex;
        }
        .model-list button .check svg {
            width: 15px;
            height: 15px;
        }

        /* ── Subheader — "Naam" instead of "Recents" ── */
        .chat-panel-subheader {
            padding: 14px 16px 4px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-soft);
            letter-spacing: 0.2px;
        }
        .chat-list {
            list-style: none;
            margin: 0;
            padding: 4px 8px 12px;
            overflow-y: auto;
            flex: 1;
        }
        .chat-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: background .15s;
            margin-bottom: 2px;
        }
        .chat-list li:hover {
            background: var(--icon-hover);
        }
        .chat-list li.active {
            background: var(--accent-soft);
        }
        .chat-list .chat-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }
        .delete-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .2s, color .2s;
        }
        .delete-btn:hover {
            background: #fbe3e3;
            color: var(--danger);
        }
        [data-theme="dark"] .delete-btn:hover {
            background: #3a1a1a;
        }
        .delete-btn svg {
            width: 16px;
            height: 16px;
        }
        .empty-list {
            padding: 24px 16px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ── Overlay ── */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 25;
            display: none;
            background: rgba(0, 0, 0, .25);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .overlay.open {
            display: block;
        }

        /* ── Messages Container ── */
        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 18px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: background .3s;
        }

        /* ── Message Row ── */
        .msg-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .msg-row.user {
            align-items: flex-end;
        }
        .msg-row.ai {
            align-items: flex-start;
        }

        /* ── Bubble ── */
        .bubble {
            padding: 4px 0 2px 0;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
            width: 100%;
            transition: color .3s;
        }
        /* User text – boxed bubble (only when it's plain text) */
        .msg-row.user .bubble.text-only {
            text-align: left;
            width: fit-content;
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid var(--accent-soft);
            background: var(--accent-soft);
            margin-left: auto;
        }
        .msg-link {
            color: var(--accent);
            text-decoration: underline;
            word-break: break-all;
        }

        /* AI text – plain, no box */
        .msg-row.ai .bubble {
            text-align: left;
        }
        .ai-typing-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
        }
        .ai-typing-row .bubble {
            width: 100%;
        }
        .ai-typing-avatar {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            animation: ai-avatar-spin 1.4s linear infinite;
        }
        @keyframes ai-avatar-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ── Attachments — natural, no bubble wrap ── */
        .msg-attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 6px;
            max-width: 100%;
        }
        .msg-row.user .msg-attachments {
            justify-content: flex-end;
            margin-left: auto;
        }
        .msg-row.ai .msg-attachments {
            justify-content: flex-start;
        }

        .attachment-img {
            max-width: min(280px, 78vw);
            max-height: 340px;
            border-radius: 14px;
            display: block;
            object-fit: cover;
            background: var(--icon-hover);
        }
        .attachment-video {
            max-width: min(300px, 80vw);
            max-height: 340px;
            border-radius: 14px;
            display: block;
            background: #000;
        }
        .attachment-file {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--icon-hover);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 13.5px;
            max-width: 260px;
            font-weight: 500;
            color: var(--text);
            transition: background .3s;
        }
        .attachment-file svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: var(--text-soft);
        }
        .attachment-file span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .attachment-file-clickable {
            cursor: pointer;
        }

        /* ── Scroll to top button ── */
        .scroll-top-btn {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 116px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-elevated, #fff);
            color: var(--text-soft);
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
            cursor: pointer;
            z-index: 50;
        }
        .scroll-top-btn.show {
            display: flex;
        }
        .scroll-top-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ── Text preview modal ── */
        .text-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }
        .text-modal-overlay.open {
            display: flex;
        }
        .text-modal {
            width: 100%;
            max-width: 480px;
            max-height: 75vh;
            background: var(--bg);
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .text-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text);
        }
        .text-modal-header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .text-modal-body {
            width: 100%;
            box-sizing: border-box;
            border: none;
            outline: none;
            background: transparent;
            resize: none;
            padding: 16px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 15px;
            line-height: 1.6;
            font-family: inherit;
            color: var(--text);
        }
        .text-modal-body[readonly] {
            cursor: default;
        }

        /* ── Memory modal ── */
        .memory-modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .memory-sub {
            font-size: 12.5px;
            color: var(--text-muted);
        }
        .memory-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .memory-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--icon-hover);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text);
        }
        .memory-list li span {
            flex: 1;
            word-break: break-word;
        }
        .memory-list .memory-del {
            border: none;
            background: transparent;
            color: var(--text-muted);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .memory-list .memory-del svg {
            width: 13px;
            height: 13px;
        }
        .memory-list .memory-del:hover {
            background: #fbe3e3;
            color: var(--danger);
        }
        .memory-empty {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            padding: 10px 0;
        }
        .memory-add-row {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px 8px 6px 14px;
        }
        .memory-add-row input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
        }
        .memory-add-row input::placeholder {
            color: var(--text-muted);
        }

        /* ── Smart suggestion chips ── */
        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }
        .suggestion-chip {
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }
        .suggestion-chip:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Sources button (inline in action row, ChatGPT-style) ── */
        .sources-inline-btn {
            width: auto !important;
            padding: 0 10px;
            border-radius: 15px;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
        }
        .sources-inline-btn svg {
            width: 14px;
            height: 14px;
        }
        .sources-btn-favicon {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .sources-inline-panel {
            display: none;
            flex-direction: column;
            position: absolute;
            bottom: 34px;
            left: 0;
            min-width: 240px;
            max-width: 320px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--panel-shadow);
            padding: 6px;
            z-index: 40;
        }
        .sources-inline-panel.open {
            display: flex;
            animation: menuPop .16s ease;
        }
        .source-link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            transition: background .15s;
        }
        .source-link-item:hover {
            background: var(--icon-hover);
        }
        .source-favicon {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            flex-shrink: 0;
            background: var(--icon-hover);
        }
        .source-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .source-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .source-domain {
            font-size: 11.5px;
            color: var(--text-muted);
        }

        /* ── Message Actions ── */
        .msg-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 6px;
            padding-left: 0;
            flex-wrap: wrap;
        }
        .msg-row.user .msg-actions {
            justify-content: flex-end;
        }
        .msg-row.ai .msg-actions {
            justify-content: flex-start;
        }

        .msg-action-btn {
            border: none;
            background: transparent;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: background .15s, color .15s, transform .15s;
            flex-shrink: 0;
            position: relative;
        }
        .msg-action-btn:hover {
            background: var(--icon-hover);
            color: var(--text);
            transform: scale(1.06);
        }
        .msg-action-btn svg {
            width: 16px;
            height: 16px;
        }
        .msg-action-btn.active {
            color: var(--accent);
        }
        .msg-action-btn.active.dislike-active {
            color: var(--danger);
        }

        .msg-action-menu {
            position: absolute;
            bottom: 34px;
            left: 0;
            min-width: 170px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
            padding: 6px;
            display: none;
            flex-direction: column;
            z-index: 30;
        }
        .msg-action-menu.open {
            display: flex;
        }
        .msg-action-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            background: transparent;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            transition: background .15s;
            font-weight: 500;
        }
        .msg-action-menu button:hover {
            background: var(--icon-hover);
        }
        .msg-action-menu button svg {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }

        /* ── Empty State ── */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 15px;
            text-align: center;
            padding: 0 32px;
            gap: 8px;
        }
        .empty-state .icon-big {
            font-size: 40px;
            margin-bottom: 4px;
            opacity: 0.5;
        }
        .empty-state .icon-big-img {
            width: 120px;
            height: 120px;
            margin-bottom: 4px;
        }
        .empty-state .sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ── Composer ── */
        .composer {
            margin: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
            padding: 6px 16px 6px 18px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--composer-bg);
            box-shadow: 0 2px 12px var(--shadow-color);
            flex-shrink: 0;
            transition: background .3s, border-color .3s, box-shadow .3s;
        }
        .composer:focus-within {
            border-color: var(--accent);
            box-shadow: 0 2px 16px rgba(16, 163, 127, .12);
        }

        .pending-attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 8px;
            margin: 10px 0 8px;
        }
        .pending-attachment {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            overflow: visible;
            flex-shrink: 0;
        }
        .pending-attachment img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            background: var(--icon-hover);
        }
        .pending-attachment .pending-icon {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: var(--icon-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-soft);
        }
        .pending-attachment .pending-icon svg {
            width: 20px;
            height: 20px;
        }
        .pending-attachment-text {
            width: auto;
            height: 52px;
            min-width: 120px;
            border-radius: 12px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
        }
        .pending-text-badge {
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .02em;
            color: var(--text-soft);
            background: var(--icon-hover);
            border-radius: 6px;
            padding: 4px 6px;
        }
        .pending-text-label {
            font-size: 13px;
            color: var(--text);
            white-space: nowrap;
        }
        .pending-attachment .pending-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            border: none;
            background: var(--text);
            color: var(--bg);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 1px 4px var(--shadow-color);
            transition: background .2s, color .2s;
        }
        .pending-attachment .pending-remove:hover {
            background: var(--danger);
            color: #fff;
        }
        .pending-attachment .pending-remove svg {
            width: 11px;
            height: 11px;
        }

        .composer-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            padding: 8px 0 12px;
            color: var(--text);
            resize: none;
            font-family: inherit;
            line-height: 1.4;
            overflow-y: hidden;
            transition: color .3s;
        }
        .composer-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .composer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .composer-icon-btn {
            background: var(--icon-hover);
            color: var(--text-soft);
            transition: background .2s, color .2s, transform .15s;
        }
        .composer-icon-btn:hover {
            background: var(--border);
            color: var(--text);
            transform: scale(1.04);
        }
        .composer-icon-btn.has-text {
            background: var(--accent);
            color: #fff;
        }
        .composer-icon-btn.has-text:hover {
            background: var(--accent-hover);
        }
        .composer-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ── Attach Menu ── */
        .attach-wrapper {
            position: relative;
        }
        .attach-menu {
            position: absolute;
            bottom: 52px;
            left: 0;
            width: 200px;
            background: var(--attach-menu-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
            padding: 6px;
            display: none;
            flex-direction: column;
            z-index: 30;
        }
        .attach-menu.open {
            display: flex;
        }
        .attach-menu button {
            display: flex;
            align-items: center;
            gap: 12px;
            border: none;
            background: transparent;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            transition: background .15s;
            font-weight: 500;
        }
        .attach-menu button:hover {
            background: var(--icon-hover);
        }
        .attach-menu svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: var(--text-soft);
        }

        /* ── Action Button ── */
        .action-btn {
            width: 42px;
            height: 42px;
            background: var(--action-bg);
            color: var(--action-color);
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, color .15s, transform .15s, box-shadow .15s;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }
        .action-btn:hover {
            background: var(--action-hover);
            transform: scale(1.04);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
        }
        .action-btn.has-text {
            background: var(--accent);
        }
        .action-btn.has-text:hover {
            background: var(--accent-hover);
        }
        .action-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ── Voice Call Overlay ── */
        .call-overlay {
            position: fixed;
            inset: 0;
            background: var(--call-bg);
            color: var(--call-text);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background .3s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .call-overlay.open {
            display: flex;
        }
        .call-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 32px;
            text-align: center;
        }
        .call-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--call-circle-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: background .3s, box-shadow .3s;
        }
        .call-circle svg {
            width: 40px;
            height: 40px;
        }
        .call-circle.listening {
            background: var(--accent);
            animation: pulse 1.6s infinite;
        }
        .call-circle.speaking {
            background: #3b82f6;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 163, 127, .4);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(16, 163, 127, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 163, 127, 0);
            }
        }
        .call-status {
            font-size: 16px;
            color: var(--text-soft);
            font-weight: 500;
        }
        .call-transcript {
            font-size: 15px;
            color: var(--text-soft);
            max-width: 300px;
            min-height: 24px;
            background: var(--call-circle-bg);
            padding: 12px 20px;
            border-radius: 16px;
            line-height: 1.5;
        }
        .call-end-btn {
            margin-top: 8px;
            border: none;
            background: var(--danger);
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .15s;
        }
        .call-end-btn:hover {
            opacity: .9;
            transform: scale(1.03);
        }

        @media (max-width: 480px) {
            .bubble {
                font-size: 16px;
            }
            .composer {
                padding: 4px 12px 4px 14px;
                border-radius: 24px;
            }
            .composer-input {
                font-size: 15px;
                padding: 6px 0 10px;
            }
            .action-btn {
                width: 38px;
                height: 38px;
            }
            .action-btn svg {
                width: 18px;
                height: 18px;
            }
            .messages {
                padding: 12px 12px 4px;
                gap: 14px;
            }
            .call-circle {
                width: 80px;
                height: 80px;
            }
            .call-circle svg {
                width: 32px;
                height: 32px;
            }
            .icon-btn {
                width: 36px;
                height: 36px;
            }
            .icon-btn svg {
                width: 18px;
                height: 18px;
            }
            .chat-panel {
                width: min(300px, 86vw);
            }
        }
    </style>
</head>
<body>

    <!-- ─── TOP BAR (no title, only icon buttons) ─── -->
    <div class="topbar">
        <button class="icon-btn" id="hamburgerBtn" title="Chats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="right-icons">
            <button class="icon-btn" id="newChatBtn" title="Nayi chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="9.5" y1="10.5" x2="14.5" y2="10.5"/></svg>
            </button>

            <div class="topbar-menu-wrap">
                <button class="icon-btn" id="menuToggleBtn" title="Options">
                    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
                </button>

                <div class="topbar-menu" id="topbarMenu">
                    <button type="button" id="menuNewChat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                        Nayi chat kholein
                    </button>
                    <button type="button" id="menuOpenList">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                        Saari chats
                    </button>
                    <button type="button" id="menuSearch">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        Chat search karein
                    </button>
                    <button type="button" id="menuMemory">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.5H7a2.5 2.5 0 0 1 0-5H4.5a2.5 2.5 0 0 1 0-5H7a2.5 2.5 0 0 1-2.5-2.5A2.5 2.5 0 0 1 7 5h.54A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.5H17a2.5 2.5 0 0 0 0-5h2.5a2.5 2.5 0 0 0 0-5H17a2.5 2.5 0 0 0 2.5-2.5A2.5 2.5 0 0 0 17 5h-.54A2.5 2.5 0 0 0 14.5 2Z"/></svg>
                        Memory dekhein
                    </button>
                    <div class="menu-divider"></div>
                    <button type="button" class="danger" id="menuDeleteChat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                        Mौjooda chat delete karein
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ─── CHAT DRAWER ─── -->
    <div class="chat-panel" id="chatPanel">
        <div class="chat-panel-header">
            <div class="chat-panel-title">Saathi Chat</div>
            <button class="icon-btn" id="closeDrawerBtn" title="Band karein">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <button class="new-chat-pill" id="panelNewChatBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            Nayi chat
        </button>

        <!-- Search box -->
        <div class="chat-search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="chatSearchInput" placeholder="Chats search karein…" autocomplete="off">
            <button type="button" class="chat-search-clear" id="chatSearchClear" title="Clear">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- Model selector under search box -->
        <div class="model-selector" id="modelSelector">
            <div class="model-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 7v10l8 5 8-5V7Z"/><path d="M12 22V12"/><path d="M4 7l8 5 8-5"/></svg>
            </div>
            <div class="model-info">
                <div class="model-label">Model</div>
                <div class="model-name" id="modelNameLabel">Default</div>
            </div>
            <div class="model-caret">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
        </div>

        <div class="model-list" id="modelList">
            <button type="button" data-model="Default" class="selected">
                Default
                <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            </button>
            <button type="button" data-model="Fast">
                Fast
                <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            </button>
            <button type="button" data-model="Smart">
                Smart
                <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            </button>
            <button type="button" data-model="Pro">
                Pro
                <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            </button>
        </div>

        <!-- "Naam" (instead of "Recents") -->
        <div class="chat-panel-subheader">Saathi Chats (<span id="chatCountLabel">0</span>)</div>
        <ul class="chat-list" id="chatList"></ul>
    </div>

    <div class="overlay" id="overlay"></div>

    <!-- ─── MESSAGES ─── -->
    <div class="messages" id="messages"></div>
    <button class="scroll-top-btn" id="scrollTopBtn" title="Upar jaayein">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 19 19 12"/></svg>
    </button>

    <!-- ─── TEXT PREVIEW MODAL ─── -->
    <div class="text-modal-overlay" id="textModalOverlay">
        <div class="text-modal">
            <div class="text-modal-header">
                <span id="textModalTitle">Pasted content</span>
                <div class="text-modal-header-actions">
                    <button class="icon-btn" id="textModalPreviewBtn" title="Live Preview" style="display:none">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                    <button class="icon-btn" id="textModalDownloadBtn" title="Download">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                    <button class="icon-btn" id="textModalEditBtn" title="Edit">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    </button>
                    <button class="icon-btn" id="textModalSaveBtn" title="Save" style="display:none">

                    </button>

            // ── DOM refs ──
            const chatPanel = document.getElementById('chatPanel');
            const overlay = document.getElementById('overlay');
            const chatList = document.getElementById('chatList');
            const chatCountLabel = document.getElementById('chatCountLabel');
            const messagesEl = document.getElementById('messages');
            const scrollTopBtn = document.getElementById('scrollTopBtn');
            if (messagesEl && scrollTopBtn) {
                function checkScrollBtn() {
                    const distanceFromBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
                    if (distanceFromBottom > 200) {
                        scrollTopBtn.classList.add('show');
                    } else {
                        scrollTopBtn.classList.remove('show');
                    }
                }
                messagesEl.addEventListener('scroll', checkScrollBtn);
                scrollTopBtn.addEventListener('click', () => {
                    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
                });
            }

            // ── Text preview modal ──
            const textModalOverlay = document.getElementById('textModalOverlay');
            const textModalBody = document.getElementById('textModalBody');
            const textModalCloseBtn = document.getElementById('textModalCloseBtn');
            const textModalEditBtn = document.getElementById('textModalEditBtn');
            const textModalSaveBtn = document.getElementById('textModalSaveBtn');
            const textModalPreviewBtn = document.getElementById('textModalPreviewBtn');
            const textModalDownloadBtn = document.getElementById('textModalDownloadBtn');
            const textModalTitle = document.getElementById('textModalTitle');
            const previewOverlay = document.getElementById('previewOverlay');
            const previewFrame = document.getElementById('previewFrame');
            const previewCloseBtn = document.getElementById('previewCloseBtn');
            let textModalOnSave = null;

            function isHtmlContent(name, content) {
                const n = (name || '').toLowerCase();
                if (n.endsWith('.html') || n.endsWith('.htm')) return true;
                const c = (content || '').trim().toLowerCase();
                return c.startsWith('<!doctype html') || c.startsWith('<html');
            }

            function showTextModal(content, onSave, title) {
                textModalBody.value = content;
                textModalBody.readOnly = true;
                textModalTitle.textContent = title || 'Pasted content';
                textModalOnSave = typeof onSave === 'function' ? onSave : null;
                textModalEditBtn.style.display = textModalOnSave ? '' : 'none';
                textModalSaveBtn.style.display = 'none';
                textModalPreviewBtn.style.display = isHtmlContent(title, content) ? '' : 'none';
                textModalOverlay.classList.add('open');
            }
            function hideTextModal() {
                textModalOverlay.classList.remove('open');
                textModalBody.readOnly = true;
                textModalEditBtn.style.display = '';
                textModalSaveBtn.style.display = 'none';
            }
            textModalCloseBtn.addEventListener('click', hideTextModal);
            textModalEditBtn.addEventListener('click', () => {
                textModalBody.readOnly = false;
                textModalBody.focus();
                textModalEditBtn.style.display = 'none';
                textModalSaveBtn.style.display = '';
            });
            textModalSaveBtn.addEventListener('click', () => {
                if (textModalOnSave) textModalOnSave(textModalBody.value);
                textModalBody.readOnly = true;
                textModalEditBtn.style.display = '';
                textModalSaveBtn.style.display = 'none';
            });
            textModalOverlay.addEventListener('click', (e) => {
                if (e.target === textModalOverlay) hideTextModal();
            });
            textModalPreviewBtn.addEventListener('click', () => {
                previewFrame.srcdoc = textModalBody.value;
                previewOverlay.classList.add('open');
            });
            previewCloseBtn.addEventListener('click', () => {
                previewOverlay.classList.remove('open');
                previewFrame.srcdoc = '';
            });
            previewOverlay.addEventListener('click', (e) => {
                if (e.target === previewOverlay) {
                    previewOverlay.classList.remove('open');
                    previewFrame.srcdoc = '';
                }
            });
            textModalDownloadBtn.addEventListener('click', () => {
                const filename = textModalTitle.textContent || 'file.txt';
                const blob = new Blob([textModalBody.value], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            });

            // ── Memory modal ──
            const memoryModalOverlay = document.getElementById('memoryModalOverlay');
            const memoryModalCloseBtn = document.getElementById('memoryModalCloseBtn');
            const memoryList = document.getElementById('memoryList');
            const memoryInput = document.getElementById('memoryInput');
            const memoryAddBtn = document.getElementById('memoryAddBtn');
            memoryModalCloseBtn.addEventListener('click', closeMemoryModal);
            memoryModalOverlay.addEventListener('click', (e) => {
                if (e.target === memoryModalOverlay) closeMemoryModal();
            });
            function addMemoryNote() {
                const val = memoryInput.value.trim();
                if (!val) return;
                memoryNotes.push(val);
                saveMemory();
                memoryInput.value = '';
                renderMemoryList();
            }
            memoryAddBtn.addEventListener('click', addMemoryNote);
            memoryInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault();
                    addMemoryNote(); }
            });

            const msgInput = document.getElementById('msgInput');
            const actionBtn = document.getElementById('actionBtn');
            const actionIcon = document.getElementById('actionIcon');
            const attachBtn = document.getElementById('attachBtn');
            const dictateBtn = document.getElementById('dictateBtn');
            const dictateIcon = document.getElementById('dictateIcon');
            const attachMenu = document.getElementById('attachMenu');
            const fileInput = document.getElementById('fileInput');
            const photoInput = document.getElementById('photoInput');
            const videoInput = document.getElementById('videoInput');
            const cameraInput = document.getElementById('cameraInput');
            const callOverlay = document.getElementById('callOverlay');
            const callCircle = document.getElementById('callCircle');
            const callStatus = document.getElementById('callStatus');
            const callTranscript = document.getElementById('callTranscript');
            const callEndBtn = document.getElementById('callEndBtn');
            const pendingAttachmentsWrap = document.getElementById('pendingAttachmentsWrap');

            // ── Model selector ──
            const modelSelector = document.getElementById('modelSelector');
            const modelList = document.getElementById('modelList');
            const modelNameLabel = document.getElementById('modelNameLabel');
            modelSelector.addEventListener('click', (e) => {
                e.stopPropagation();
                modelSelector.classList.toggle('open');
                modelList.classList.toggle('open');
            });
            modelList.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const val = btn.getAttribute('data-model');
                    currentModel = val;
                    modelNameLabel.textContent = val;
                    modelList.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    modelList.classList.remove('open');
                    modelSelector.classList.remove('open');
                });
            });
            document.addEventListener('click', (e) => {
                if (!modelList.contains(e.target) && !modelSelector.contains(e.target)) {
                    modelList.classList.remove('open');
                    modelSelector.classList.remove('open');
                }
            });

            // ── Top-bar three-dot menu ──
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const topbarMenu = document.getElementById('topbarMenu');
            const menuNewChat = document.getElementById('menuNewChat');
            const menuOpenList = document.getElementById('menuOpenList');
            const menuSearch = document.getElementById('menuSearch');
            const menuMemory = document.getElementById('menuMemory');
            const menuDeleteChat = document.getElementById('menuDeleteChat');

            function openTopbarMenu() {
                updateTopbarMenuState();
                topbarMenu.classList.add('open');
            }
            function closeTopbarMenu() {
                topbarMenu.classList.remove('open');
            }
            function toggleTopbarMenu() {
                topbarMenu.classList.contains('open') ? closeTopbarMenu() : openTopbarMenu();
            }
            function updateTopbarMenuState() {
                const hasCurrent = !!getCurrentChat();
                menuDeleteChat.disabled = !hasCurrent;
            }

            menuToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleTopbarMenu();
            });
            document.addEventListener('click', (e) => {
                if (!topbarMenu.contains(e.target) && e.target !== menuToggleBtn) {
                    closeTopbarMenu();
                }
            });

            menuNewChat.addEventListener('click', () => {
                closeTopbarMenu();
                createChat();
            });
            menuOpenList.addEventListener('click', () => {
                closeTopbarMenu();
                openPanel();
            });
            menuSearch.addEventListener('click', () => {
                closeTopbarMenu();
                openPanel();
                setTimeout(() => chatSearchInput.focus(), 280);
            });
            menuMemory.addEventListener('click', () => {
                closeTopbarMenu();
                openMemoryModal();
            });
            menuDeleteChat.addEventListener('click', () => {
                closeTopbarMenu();
                if (currentChatId) {
                    deleteChat(currentChatId);
                }
            });

            // ── Theme (auto, follows system — no manual toggle) ──
            function loadTheme() {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'dark' || saved === 'light') {
                        currentTheme = saved;
                    } else {
                        currentTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ?
                            'dark' : 'light';
                    }
                } catch (_) {
                    currentTheme = 'light';
                }
                applyTheme();
            }

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', currentTheme);
                try { localStorage.setItem(THEME_KEY, currentTheme); } catch (_) {}
            }

            // ── Chats ──
            function loadChats() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    chats = raw ? JSON.parse(raw) : [];
                } catch (_) { chats = []; }
            }

            function saveChats() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); } catch (_) {}
            }

            // ── Memory (persists across all chats) ──
            function loadMemory() {
                try {
                    const raw = localStorage.getItem(MEMORY_KEY);
                    memoryNotes = raw ? JSON.parse(raw) : [];
                } catch (_) { memoryNotes = []; }
            }
            function saveMemory() {
                try { localStorage.setItem(MEMORY_KEY, JSON.stringify(memoryNotes)); } catch (_) {}
            }
            function renderMemoryList() {
                memoryList.innerHTML = '';
                if (memoryNotes.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'memory-empty';
                    empty.textContent = 'Abhi koi memory note nahi hai';
                    memoryList.appendChild(empty);
                    return;
                }
                memoryNotes.forEach((note, i) => {
                    const li = document.createElement('li');
                    const span = document.createElement('span');
                    span.textContent = note;
                    const delBtn = document.createElement('button');
                    delBtn.className = 'memory-del';
                    delBtn.title = 'Delete';
                    delBtn.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
                    delBtn.addEventListener('click', () => {
                        memoryNotes.splice(i, 1);
                        saveMemory();
                        renderMemoryList();
                    });
                    li.appendChild(span);
                    li.appendChild(delBtn);
                    memoryList.appendChild(li);
                });
            }
            function openMemoryModal() {
                renderMemoryList();
                memoryModalOverlay.classList.add('open');
            }
            function closeMemoryModal() {
                memoryModalOverlay.classList.remove('open');
            }

            function genId() { return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

            function createChat() {
                const chat = { id: genId(), title: 'New chat', messages: [] };
                chats.unshift(chat);
                currentChatId = chat.id;
                saveChats();
                renderChatList();
                renderMessages();
                closePanel();
            }

            function getCurrentChat() { return chats.find(c => c.id === currentChatId) || null; }

            function switchChat(id) {
                currentChatId = id;
                renderChatList();
                renderMessages();
                closePanel();
            }

            function deleteChat(id) {
                const idx = chats.findIndex(c => c.id === id);
                if (idx === -1) return;
                chats.splice(idx, 1);
                saveChats();
                if (currentChatId === id) {
                    currentChatId = chats.length > 0 ? chats[0].id : null;
                }
                renderChatList();
                renderMessages();
                updateTopbarMenuState();
            }

            function renderChatList() {
                chatList.innerHTML = '';
                chatCountLabel.textContent = chats.length;

                const q = (chatSearchQuery || '').toLowerCase();
                const filtered = q
                    ? chats.filter(c => (c.title || '').toLowerCase().includes(q))
                    : chats;

                if (filtered.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-list';
                    empty.textContent = q ? 'Koi chat match nahi hui' : 'Abhi koi chat nahi hai';
                    chatList.appendChild(empty);
                    return;
                }

                filtered.forEach(chat => {
                    const li = document.createElement('li');

            let activeTypingTimeout = null;
            let activeTypingMessage = null;

            function typeAIMessage(element, text, message) {
                element.textContent = '';
                let i = 0;
                const speed = 35;

                aiIsTyping = true;
                activeTypingMessage = message;
                updateActionButton();

                function typeNext() {
                    if (i < text.length) {
                        element.textContent += text[i++];
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                        activeTypingTimeout = setTimeout(typeNext, speed);
                    } else {
                        message.typing = false;
                        activeTypingTimeout = null;
                        activeTypingMessage = null;
                        aiIsTyping = false;
                        saveChats();
                        updateActionButton();
                        renderMessages();
                    }
                }

                typeNext();
            }

            function stopAITyping() {
                if (!aiIsTyping) return;
                if (activeTypingTimeout) {
                    clearTimeout(activeTypingTimeout);
                    activeTypingTimeout = null;
                }
                if (activeTypingMessage) {
                    activeTypingMessage.typing = false;
                    activeTypingMessage = null;
                    saveChats();
                }
                aiIsTyping = false;
                renderMessages();
                updateActionButton();
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }
            function linkifyText(text) {
                const escaped = escapeHtml(text);
                const urlRegex = /(https?:\/\/[^\s<]+)/g;
                return escaped.replace(urlRegex, url =>
                    '<a href="' + url + '" target="_blank" rel="noopener noreferrer" class="msg-link">' + url + '</a>');
            }

            function renderMessages() {
                messagesEl.innerHTML = '';
                const chat = getCurrentChat();
                if (!chat) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.innerHTML =
                        '<img class="icon-big-img" src="' + AI_AVATAR_DATA_URI + '" alt=""><div>Saathi Chat</div>';
                    messagesEl.appendChild(empty);
                    return;
                }
                if (chat.messages.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.innerHTML =
                        '<img class="icon-big-img" src="' + AI_AVATAR_DATA_URI + '" alt=""><div>Saathi Chat</div>';
                    messagesEl.appendChild(empty);

                }
                chat.messages.forEach((m, idx) => {
                    const row = document.createElement('div');
                    row.className = 'msg-row ' + (m.role === 'user' ? 'user' : 'ai');

                    const attachments = m.attachments || (m.attachment ? [m.attachment] : []);

                    // Attachments first — natural size, no bubble wrap
                    if (attachments.length > 0) {
                        row.appendChild(buildAttachmentsBlock(attachments));

                    // Text bubble
                    if (m.text || (m.role === 'ai' && m.typing)) {
