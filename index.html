            function compressPhoto(file, maxDim, quality) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            let width = img.width;
                            let height = img.height;
                            if (width > height && width > maxDim) {
                                height = Math.round(height * (maxDim / width));
                                width = maxDim;
                            } else if (height > maxDim) {
                                width = Math.round(width * (maxDim / height));
                                height = maxDim;
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            try {
                                resolve(canvas.toDataURL('image/jpeg', quality));
                            } catch (err) {
                                reject(err);
                            }
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            function extractPdfText(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const typedArray = new Uint8Array(e.target.result);
                            const pdf = await pdfjsLib.getDocument({ data: typedArray }).promise;
                            let fullText = '';
                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();
                                const pageText = textContent.items.map(item => item.str).join(' ');
                                fullText += (i > 1 ? '\n\n' : '') + '--- Page ' + i + ' ---\n' + pageText;
                            }
                            resolve(fullText.trim());
                        } catch (err) {
                            reject(err);
                        }
                    };
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(file);
                });
            }

            function handleAttachment(fileList, kind) {
                if (!fileList || fileList.length === 0) {
                    alert('Koi file select nahi hui — dubara try karein.');
                    return;
                }

                Array.from(fileList).forEach(file => {
                    if (kind === 'photo') {
                        compressPhoto(file, 900, 0.72)
                            .then(dataUrl => {
                                pendingAttachments.push({ kind: kind, name: file.name, size: file.size, dataUrl: dataUrl });
                                renderPendingAttachments();
                                updateActionButton();
                            })
                            .catch(() => {
                                pendingAttachments.push({ kind: kind, name: file.name, size: file.size });
                                renderPendingAttachments();
                                updateActionButton();
                            });
                    } else if (kind === 'video') {
                        const url = URL.createObjectURL(file);
                        pendingAttachments.push({ kind: kind, name: file.name, size: file.size, dataUrl: url });
                        renderPendingAttachments();
                        updateActionButton();
                    } else if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                        if (window.pdfjsLib) {
                            extractPdfText(file)
                                .then(text => {
                                    pendingAttachments.push({ kind: kind, name: file.name, size: file.size, content: text || '(PDF mein koi extractable text nahi mila — yeh scanned/image PDF ho sakta hai)' });
                                    renderPendingAttachments();
                                    updateActionButton();
                                })
                                .catch(() => {
                                    pendingAttachments.push({ kind: kind, name: file.name, size: file.size });
                                    renderPendingAttachments();
                                    updateActionButton();
                                });
                        } else {
                            pendingAttachments.push({ kind: kind, name: file.name, size: file.size });
                            renderPendingAttachments();
                            updateActionButton();
                        }
                    } else {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            pendingAttachments.push({ kind: kind, name: file.name, size: file.size, content: e.target.result });
                            renderPendingAttachments();
                            updateActionButton();
                        };
                        reader.onerror = () => {
                            pendingAttachments.push({ kind: kind, name: file.name, size: file.size });
                            renderPendingAttachments();
                            updateActionButton();
                        };
                        reader.readAsText(file);
                    }
                });

                msgInput.focus();
            }

            const SEND_ICON_PATH =
                '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>';

            const VOICE_ICON_PATH =
                '<line x1="3" y1="10" x2="3" y2="14"/><line x1="7.5" y1="7" x2="7.5" y2="17"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="16.5" y1="7" x2="16.5" y2="17"/><line x1="21" y1="10" x2="21" y2="14"/>';
            const STOP_ICON_PATH =
                '<rect x="4" y="4" width="16" height="16" rx="2"/>';

            let aiIsTyping = false;
            let isDictating = false;

            function updateActionButton() {
                const hasText = msgInput.value.trim().length > 0 || pendingAttachments.length > 0;
                if (aiIsTyping) {
                    actionIcon.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        STOP_ICON_PATH + '</svg>';
                    actionBtn.classList.add('has-text');
                    actionBtn.title = 'Rokein';
                } else if (isDictating) {
                    actionIcon.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        SEND_ICON_PATH + '</svg>';
                    actionBtn.classList.add('has-text');
                    actionBtn.title = 'Text mein badlein';
                } else if (hasText) {
                    actionIcon.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        SEND_ICON_PATH + '</svg>';
                    actionBtn.classList.add('has-text');
                    actionBtn.title = 'Send';
                } else {
                    actionIcon.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        VOICE_ICON_PATH + '</svg>';
                    actionBtn.classList.remove('has-text');
                    actionBtn.title = 'Voice se baat karein';
                }
            }

            // ── Voice call ──
            let recognition = null;
            let callActive = false;

            function speak(text, onEnd) {
                if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'hi-IN';
                utter.onend = () => { if (onEnd) onEnd(); };
                utter.onerror = () => { if (onEnd) onEnd(); };
                window.speechSynthesis.speak(utter);
            }

            function listenOnce() {
                if (!callActive) return;
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    callStatus.textContent = 'Yeh browser voice input support nahi karta. Chrome try karein.';
                    return;
                }
                recognition = new SR();
                recognition.lang = 'hi-IN';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                callCircle.className = 'call-circle listening';
                callStatus.textContent = 'Sun raha hoon…';
                callTranscript.textContent = '';
                recognition.onresult = (e) => {
                    const transcript = e.results[0][0].transcript;
                    callTranscript.textContent = transcript;
                    handleVoiceMessage(transcript);
                };
                recognition.onerror = () => {
                    if (callActive) {
                        callStatus.textContent = 'Sun nahi paya, phir se try kar raha hoon…';
                        setTimeout(listenOnce, 800);
                    }
                };
                recognition.onend = () => {};
                try { recognition.start(); } catch (_) { callStatus.textContent = 'Voice start nahi ho paya.'; }
            }

            function handleVoiceMessage(transcript) {
                if (!transcript || !transcript.trim()) { listenOnce(); return; }
                let chat = getCurrentChat();
                if (!chat) {
                    chat = { id: genId(), title: 'New chat', messages: [] };
                    chats.unshift(chat);
                    currentChatId = chat.id;
                }
                if (chat.messages.length === 0) {
                    chat.title = transcript.length > 28 ? transcript.slice(0, 28) + '…' : transcript;
                }
                chat.messages.push({ role: 'user', text: transcript });
                saveChats();
                renderChatList();
                renderMessages();
                callCircle.className = 'call-circle';
                callStatus.textContent = 'Soch raha hoon…';
                setTimeout(() => {
                    const replyText = 'Maine suna: "' + transcript + '" — yeh ek demo jawab hai. Asli AI reply ke liye API connect karni hogi.';
                    chat.messages.push({ role: 'ai', text: replyText, typing: true });
                    saveChats();
                    renderMessages();
                    callCircle.className = 'call-circle speaking';
                    callStatus.textContent = 'Bol raha hoon…';
                    speak(replyText, () => { if (callActive) listenOnce(); });
                }, 500);
            }

            function startCall() { callActive = true;
                callOverlay.classList.add('open');
                listenOnce(); }

            function stopCall() {
                callActive = false;
                if (recognition) { try { recognition.abort(); } catch (_) {} recognition = null; }
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                callOverlay.classList.remove('open');
            }
            callEndBtn.addEventListener('click', stopCall);

            // ── Dictate ──
            const DICTATE_MIC_ICON_PATH =
                '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>';
            const DICTATE_CANCEL_ICON_PATH =
                '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';

            let dictateRecognition = null;
            let dictateTranscript = '';
            let dictateManualStop = false;

            function updateDictateButton() {
                if (isDictating) {
                    dictateIcon.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        DICTATE_CANCEL_ICON_PATH + '</svg>';
                    dictateBtn.classList.add('has-text');
                    dictateBtn.title = 'Recording cancel karein';
                } else {
                    dictateIcon.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        DICTATE_MIC_ICON_PATH + '</svg>';
                    dictateBtn.classList.remove('has-text');
                    dictateBtn.title = 'Bol kar likhein';
                }
            }

            function startDictation() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { alert('Yeh browser voice dictation support nahi karta. Chrome try karein.'); return; }
                dictateTranscript = '';
                dictateManualStop = false;
                dictateRecognition = new SR();
                dictateRecognition.lang = 'hi-IN';
                dictateRecognition.interimResults = true;
                dictateRecognition.continuous = true;
                dictateRecognition.onresult = (e) => {
                    let liveText = '';
                    for (let i = 0; i < e.results.length; i++) { liveText += e.results[i][0].transcript; }
                    dictateTranscript = liveText;
                };
                dictateRecognition.onerror = () => {};
                dictateRecognition.onend = () => {
                    if (isDictating && !dictateManualStop) {
                        try { dictateRecognition.start(); } catch (_) {}
                    }
                };
                try {
                    dictateRecognition.start();
                    isDictating = true;
                    updateDictateButton();
                    updateActionButton();
                } catch (_) {
                    isDictating = false;
                }
            }

            function stopDictateEngine() {
                dictateManualStop = true;
                if (dictateRecognition) {
                    try { dictateRecognition.stop(); } catch (_) {}
                }
            }

            function cancelDictation() {
                stopDictateEngine();
                isDictating = false;
                dictateTranscript = '';
                updateDictateButton();
                updateActionButton();
            }

            function finalizeDictation() {
                stopDictateEngine();
                isDictating = false;
                updateDictateButton();
                const text = dictateTranscript.trim();
                dictateTranscript = '';
                if (text) {
                    const baseText = msgInput.value ? msgInput.value.trim() + ' ' : '';
                    msgInput.value = baseText + text;
                    autoResizeInput();
                    msgInput.focus();
                }
                updateActionButton();
            }

            dictateBtn.addEventListener('click', () => {
                if (isDictating) {
                    cancelDictation();
                } else {
                    startDictation();
                }
            });

            // ── Send ──
            function sendMessage() {
                const text = msgInput.value.trim();
                if (!text && pendingAttachments.length === 0) return;

                let chat = getCurrentChat();
                if (!chat) {
                    chat = { id: genId(), title: 'New chat', messages: [] };
                    chats.unshift(chat);
                    currentChatId = chat.id;
                }
                if (chat.messages.length === 0) {
                    const titleSource = text || (pendingAttachments[0] ? pendingAttachments[0].name : 'New chat');
                    chat.title = titleSource.length > 28 ? titleSource.slice(0, 28) + '…' : titleSource;
                }

                const attachments = pendingAttachments;
                chat.messages.push({ role: 'user', text: text, attachments: attachments });
                const pendingReply = { role: 'ai', text: '', typing: true };
                chat.messages.push(pendingReply);
                msgInput.value = '';
                autoResizeInput();
                pendingAttachments = [];
                renderPendingAttachments();
                updateActionButton();
                saveChats();
                renderChatList();
                renderMessages();
                updateTopbarMenuState();

                const mediaAttachments = attachments.filter(a => a.kind !== 'text');
                const textAttachments = attachments.filter(a => a.kind === 'text');

                if (mediaAttachments.length > 0) {
                    setTimeout(() => {
                        let replyText;
                        if (mediaAttachments.length === 1) {
                            const a = mediaAttachments[0];
                            if (a.kind === 'video') {
                                replyText = 'Video mil gaya: "' + a.name + '" (' + formatSize(a.size) +
                                    '). Yahan video analysis ke liye AI vision API connect karni hogi.';
                            } else if (a.kind === 'photo') {
                                replyText = 'Photo mil gayi: "' + a.name +
                                    '". Image samajh kar jawab dene ke liye vision AI / API connect karein.';
                            } else {
                                replyText = 'File mil gayi: "' + a.name + '" (' + formatSize(a.size) +
                                    '). Process karne ke liye backend / API connect karni hogi.';
                            }
                        } else {
                            const photos = mediaAttachments.filter(a => a.kind === 'photo').length;
                            const videos = mediaAttachments.filter(a => a.kind === 'video').length;
                            const files = mediaAttachments.filter(a => a.kind === 'file').length;
                            const parts = [];
                            if (photos) parts.push(photos + ' photo');
                            if (videos) parts.push(videos + ' video');
                            if (files) parts.push(files + ' file');
                            replyText = mediaAttachments.length + ' items mil gaye (' + parts.join(', ') +
                                '). Sabko samajh kar jawab dene ke liye AI/API connect karni hogi.';
                        }
                        pendingReply.text = replyText;
                        saveChats();
                        renderMessages();
                    }, 500);
                } else {
                    const combinedText = textAttachments.length > 0
                        ? textAttachments.map(a => a.content).join('\n\n') + (text ? ('\n\n' + text) : '')
                        : text;
                    const SAATHI_KEY_STORE = 'saathi_api_key';
                    let SAATHI_KEY = localStorage.getItem(SAATHI_KEY_STORE);
                    if (!SAATHI_KEY) {
                        SAATHI_KEY = prompt('Saathi API Key डालें:');
                        if (SAATHI_KEY) {
                            localStorage.setItem(SAATHI_KEY_STORE, SAATHI_KEY.trim());
                        }
                    }

                    const imageMatch = /^\/image\s+([\s\S]+)/i.exec(combinedText.trim());
                    if (imageMatch) {
                        const imgPrompt = imageMatch[1].trim();
                        const SAATHI_IMAGE_URL = 'https://saathi-ai-y48j.onrender.com/v1/image';
                        fetch(SAATHI_IMAGE_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-API-Key': SAATHI_KEY
                            },
                            body: JSON.stringify({
                                prompt: imgPrompt,
                                model: currentModel
                            })
                        })
                        .then(async res => {
                            const data = await res.json();
                            if (!res.ok) {
                                if (res.status === 401 || res.status === 403) {
                                    localStorage.removeItem(SAATHI_KEY_STORE);
                                    throw new Error((data.detail || data.error || 'API key invalid ya expired ho gayi hai') + ' — agla message bhejte waqt nayi API Key maangi jaayegi.');
                                }
                                throw new Error(data.detail || data.error || 'API error');
                            }
                            return data;
                        })
                        .then(data => {
                            const imgSrc = data.image_url || (data.image_base64 ? ('data:image/png;base64,' + data.image_base64) : null);
                            if (imgSrc) {
                                pendingReply.attachments = [{ kind: 'photo', name: 'generated-image.png', dataUrl: imgSrc }];
                                pendingReply.text = data.caption || 'Yeh raha aapka generated image:';
                            } else {
                                pendingReply.text = 'Image generate nahi ho payi — API se koi image nahi mili.';
                            }
                            saveChats();
                            renderMessages();
                        })
                        .catch(err => {
                            pendingReply.text = 'Image generation error: ' + err.message;
                            saveChats();
                            renderMessages();
                        });
                        return;
                    }

                    const websiteMatch = /^\/website\s+([\s\S]+)/i.exec(combinedText.trim());
                    if (websiteMatch) {
                        const sitePrompt = websiteMatch[1].trim();
                        const SAATHI_WEBSITE_URL = 'https://saathi-ai-y48j.onrender.com/v1/website';
                        fetch(SAATHI_WEBSITE_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-API-Key': SAATHI_KEY
                            },
                            body: JSON.stringify({
                                prompt: sitePrompt,
                                model: currentModel
                            })
                        })
                        .then(async res => {
                            const data = await res.json();
                            if (!res.ok) {
                                if (res.status === 401 || res.status === 403) {
                                    localStorage.removeItem(SAATHI_KEY_STORE);
                                    throw new Error((data.detail || data.error || 'API key invalid ya expired ho gayi hai') + ' — agla message bhejte waqt nayi API Key maangi jaayegi.');
                                }
                                throw new Error(data.detail || data.error || 'API error');
                            }
                            return data;
                        })
                        .then(data => {
                            const html = data.html || data.code;
                            if (html) {
                                pendingReply.attachments = [{ kind: 'file', name: data.filename || 'website.html', content: html }];
                                pendingReply.text = data.caption || 'Yeh raha aapki website ka code — file par click karke dekh, edit ya preview kar sakte hain.';
                            } else {
                                pendingReply.text = 'Website generate nahi ho payi — API se koi code nahi mila.';
                            }
                            saveChats();
                            renderMessages();
                        })
                        .catch(err => {
                            pendingReply.text = 'Website generation error: ' + err.message;
                            saveChats();
                            renderMessages();
                        });
                        return;
                    }

                    const videoMatch = /^\/video\s+([\s\S]+)/i.exec(combinedText.trim());
                    if (videoMatch) {
                        const videoPrompt = videoMatch[1].trim();
                        const SAATHI_VIDEO_URL = 'https://saathi-ai-y48j.onrender.com/v1/video';
                        fetch(SAATHI_VIDEO_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-API-Key': SAATHI_KEY
                            },
                            body: JSON.stringify({
                                prompt: videoPrompt,
                                model: currentModel,
                                include_voice: true,
                                voice_lang: 'hi-IN'
                            })
                        })
                        .then(async res => {
                            const data = await res.json();
                            if (!res.ok) {
                                if (res.status === 401 || res.status === 403) {
                                    localStorage.removeItem(SAATHI_KEY_STORE);
                                    throw new Error((data.detail || data.error || 'API key invalid ya expired ho gayi hai') + ' — agla message bhejte waqt nayi API Key maangi jaayegi.');
                                }
                                throw new Error(data.detail || data.error || 'API error');
                            }
                            return data;
                        })
                        .then(data => {
                            const videoSrc = data.video_url || (data.video_base64 ? ('data:video/mp4;base64,' + data.video_base64) : null);
                            if (videoSrc) {
                                pendingReply.attachments = [{ kind: 'video', name: 'generated-video.mp4', dataUrl: videoSrc }];
                                pendingReply.text = data.caption || 'Yeh raha aapka generated video — awaaz (narration) bhi isi mein set hai, download karke seedha chala sakte hain.';
                            } else {
                                pendingReply.text = 'Video generate nahi ho payi — API se koi video nahi mili.';
                            }
                            saveChats();
                            renderMessages();
                        })
                        .catch(err => {
                            pendingReply.text = 'Video generation error: ' + err.message;
                            saveChats();
                            renderMessages();
                        });
                        return;
                    }

                    const SAATHI_URL = 'https://saathi-ai-y48j.onrender.com/v1/chat';
                    fetch(SAATHI_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-API-Key': SAATHI_KEY
                        },
                        body: JSON.stringify({
                            message: combinedText,
                            model: currentModel,
                            memory: memoryNotes,
                            allow_web_search: true
                        })
                    })
                    .then(async res => {
                        const data = await res.json();
                        if (!res.ok) {
                            if (res.status === 401 || res.status === 403) {
                                localStorage.removeItem(SAATHI_KEY_STORE);
                                throw new Error((data.detail || data.error || 'API key invalid ya expired ho gayi hai') + ' — agla message bhejte waqt nayi API Key maangi jaayegi.');
                            }
                            throw new Error(data.detail || data.error || 'API error');
                        }
                        return data;
                    })
                    .then(data => {
                        const replyText = data.reply || 'Saathi से जवाब नहीं मिला।';
                        pendingReply.text = replyText;
                        if (Array.isArray(data.suggestions) && data.suggestions.length > 0) {
                            pendingReply.suggestions = data.suggestions.slice(0, 4);
                        }
                        if (Array.isArray(data.sources) && data.sources.length > 0) {
                            pendingReply.sources = data.sources.slice(0, 3);
                        }
                        saveChats();
                        renderMessages();
                    })
                    .catch(err => {
                        pendingReply.text = 'Saathi connection error: ' + err.message;
                        saveChats();
                        renderMessages();
                    });
                }
            }

            // ── Event listeners ──
            document.getElementById('newChatBtn').addEventListener('click', createChat);
            document.getElementById('panelNewChatBtn').addEventListener('click', createChat);
            document.getElementById('hamburgerBtn').addEventListener('click', togglePanel);
            document.getElementById('closeDrawerBtn').addEventListener('click', closePanel);
            overlay.addEventListener('click', () => { closePanel();
                closeAttachMenu(); });

            actionBtn.addEventListener('click', () => {
                if (aiIsTyping) {
                    stopAITyping();
                } else if (isDictating) {
                    finalizeDictation();
                } else if (msgInput.value.trim().length > 0 || pendingAttachments.length > 0) {
                    sendMessage();
                } else {
                    startCall();
                }
            });

            const MSG_INPUT_MAX_HEIGHT = 150;
            function autoResizeInput() {
                if (!msgInput.value) {
                    msgInput.style.height = '';
                    msgInput.style.overflowY = 'hidden';
                    return;
                }
                msgInput.style.height = 'auto';
                const newHeight = Math.min(msgInput.scrollHeight, MSG_INPUT_MAX_HEIGHT);
                msgInput.style.height = newHeight + 'px';
                msgInput.style.overflowY = msgInput.scrollHeight > MSG_INPUT_MAX_HEIGHT ? 'auto' : 'hidden';
            }

            msgInput.addEventListener('input', () => { updateActionButton();
                autoResizeInput(); });
            msgInput.addEventListener('focus', autoResizeInput);
            function looksLikeCode(str) {
                if (!str) return false;
                const codeSignalRegex = /(\{|\}|;|=>|<\/?[a-zA-Z][^>]*>|\bfunction\b|\bconst\b|\blet\b|\bvar\b|\bdef\b|\bclass\b|\bimport\b|\breturn\b|#include|<\?php|console\.log)/g;
                const matches = str.match(codeSignalRegex);
                const signalCount = matches ? matches.length : 0;
                const lineCount = str.split('\n').length;
                return (lineCount >= 3 && signalCount >= 3) || signalCount >= 6;
            }

            msgInput.addEventListener('paste', (e) => {
                const pasted = (e.clipboardData || window.clipboardData).getData('text');
                if (pasted && pasted.length > 60 && looksLikeCode(pasted)) {
                    e.preventDefault();
                    pendingAttachments.push({
                        kind: 'text',
                        name: 'Pasted code',
                        content: pasted,
                        size: pasted.length
                    });
                    renderPendingAttachments();
                    updateActionButton();
                    return;
                }
                setTimeout(() => { autoResizeInput();
                    updateActionButton(); }, 0);
            });

            attachBtn.addEventListener('click', (e) => { e.stopPropagation();
                toggleAttachMenu(); });
            document.addEventListener('click', (e) => {
                if (!attachMenu.contains(e.target) && e.target !== attachBtn) { closeAttachMenu(); }
            });

            document.getElementById('attachFileOption').addEventListener('click', () => { closeAttachMenu();
                fileInput.click(); });
            document.getElementById('attachPhotoOption').addEventListener('click', () => { closeAttachMenu();
                photoInput.click(); });
            document.getElementById('attachVideoOption').addEventListener('click', () => { closeAttachMenu();
                videoInput.click(); });
            document.getElementById('attachCameraOption').addEventListener('click', () => { closeAttachMenu();
                cameraInput.click(); });

            // ── Text Tools (quick content-generation templates) ──
            const textToolsMenu = document.getElementById('textToolsMenu');
            function openTextToolsMenu() { textToolsMenu.classList.add('open'); }
            function closeTextToolsMenu() { textToolsMenu.classList.remove('open'); }
            document.getElementById('attachTextToolsOption').addEventListener('click', () => {
                closeAttachMenu();
                openTextToolsMenu();
            });
            document.addEventListener('click', (e) => {
                if (!textToolsMenu.contains(e.target) && e.target.id !== 'attachTextToolsOption') {
                    closeTextToolsMenu();
                }
            });
            textToolsMenu.querySelectorAll('button[data-template]').forEach(btn => {
                btn.addEventListener('click', () => {
                    closeTextToolsMenu();
                    const template = btn.getAttribute('data-template');
                    const baseText = msgInput.value ? msgInput.value.trim() + ' ' : '';
                    msgInput.value = baseText + template;
                    autoResizeInput();
                    updateActionButton();
                    msgInput.focus();
                    msgInput.setSelectionRange(msgInput.value.length, msgInput.value.length);
                });
            });

            fileInput.addEventListener('change', (e) => { handleAttachment(e.target.files, 'file');
                e.target.value = ''; });
            photoInput.addEventListener('change', (e) => { handleAttachment(e.target.files, 'photo');
                e.target.value = ''; });
            videoInput.addEventListener('change', (e) => { handleAttachment(e.target.files, 'video');
                e.target.value = ''; });
            cameraInput.addEventListener('change', (e) => { handleAttachment(e.target.files, 'photo');
                e.target.value = ''; });

            // ── Init ──
            loadTheme();
            loadChats();
            loadMemory();
            if (chats.length > 0) { currentChatId = chats[0].id; }
            renderChatList();
            renderMessages();
            updateActionButton();
            updateDictateButton();
            autoResizeInput();
            updateTopbarMenuState();
        })();
    </script>

</body>
