<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Saathi Chat</title>
<style>
:root{--bg:#ffffff;--page-bg:#f6f7f9;--text:#1a1a2e;--text-soft:#6b6b80;--text-muted:#8e8ea0;--border:#eaeef2;--accent:#10a37f;--accent-hover:#0d8b6c;--accent-soft:#e6f7f1;--danger:#e5484d;--panel-bg:#ffffff;--panel-shadow:0 12px 40px rgba(0,0,0,.10);--composer-bg:#ffffff;--icon-hover:#f0f2f5;--icon-circle-bg:#f0f2f5;--action-bg:#1a1a2e;--action-color:#ffffff;--action-hover:#2d2d44;--attach-menu-bg:#ffffff;--shadow-color:rgba(0,0,0,.04)}
[data-theme="dark"]{--bg:#1a1a1e;--page-bg:#121216;--text:#ececf0;--text-soft:#9a9aaa;--text-muted:#7a7a8a;--border:#2e2e38;--accent:#10a37f;--accent-hover:#0d8b6c;--accent-soft:#1a2e28;--panel-bg:#18181e;--panel-shadow:0 12px 40px rgba(0,0,0,.5);--composer-bg:#1a1a20;--icon-hover:#2a2a34;--icon-circle-bg:#2a2a34;--action-bg:#2a2a34;--action-color:#ececf0;--action-hover:#3a3a46;--attach-menu-bg:#1a1a20;--shadow-color:rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0}
button{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;appearance:none;font-family:inherit}
button:active{transform:scale(.94);opacity:.75;transition:transform .1s ease,opacity .1s ease}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--page-bg);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.ms-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:140;display:none}
.ms-overlay.open{display:block}
.ms-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--page-bg);border-radius:28px 28px 0 0;z-index:141;padding:8px 14px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s cubic-bezier(.22,1,.36,1);max-height:88vh;overflow-y:auto}
.ms-sheet.open{transform:translateY(0)}
.ms-top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.ms-x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text);cursor:pointer;padding:0}
.ms-x svg{width:26px;height:26px}
.ms-title{font-size:20px;font-weight:600;color:var(--text)}
.ms-list{background:var(--panel-bg);border-radius:22px;overflow:hidden}
.ms-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:none;background:transparent;text-align:left;padding:16px 18px;cursor:pointer;font-family:inherit;color:var(--text)}
.ms-item+.ms-item{border-top:1px solid var(--border)}
.ms-name{font-size:19px}
.ms-sub{font-size:15.5px;color:var(--text-soft);margin-top:3px}
.ms-badge{display:inline-block;margin-left:10px;padding:3px 11px;border-radius:14px;background:#e3ecfb;color:#1d4fa8;font-size:14.5px;font-weight:600;vertical-align:middle}
.ms-upgrade{display:none;padding:6px 8px 12px}
.ms-up-text{font-size:17px;color:var(--text-soft);margin:6px 2px 20px}
.ms-up-title{display:none}
.ms-up-btn{display:block;width:calc(100% - 4px);margin:0 2px;height:40px;border:none;border-radius:20px;background:#0d0d0f;color:#fff;font-size:19px;font-weight:600;line-height:40px;padding:0;cursor:pointer;font-family:inherit}
[data-theme="dark"] .ms-up-btn{background:#fff;color:#0d0d0f}
[data-theme="dark"] .ms-badge{background:#243456;color:#a9c4f5}
.ms-check{width:26px;height:26px;color:#2f5be7;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-pill{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;min-width:118px;padding:0 22px;border:none;border-radius:22px;background:var(--panel-bg);color:#5b5bd6;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer;font-family:inherit;font-size:17px;font-weight:600}
.cl-page{position:fixed;inset:0;background:var(--bg);z-index:88;display:none;flex-direction:column}
.cl-page.open{display:flex}
.cl-top{display:flex;align-items:flex-start;gap:6px;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 6px}
.cl-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text);cursor:pointer;padding:0;flex-shrink:0}
.cl-back svg{width:26px;height:26px}
.cl-title{font-size:24px;font-weight:700;color:var(--text);line-height:1.2;margin-top:4px}
.cl-sub{font-size:14px;color:var(--text-muted);margin-top:3px}
.cl-bar{display:flex;gap:10px;padding:8px 14px}
.cl-search{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--panel-bg);border-radius:12px;padding:0 12px;height:44px;min-width:0}
.cl-search svg{width:20px;height:20px;color:var(--text-muted);flex-shrink:0}
.cl-search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--text);font-family:inherit;min-width:0}
.cl-filter{width:44px;height:44px;border:1px solid var(--border);background:var(--panel-bg);border-radius:12px;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.cl-filter svg{width:20px;height:20px}
.cl-sortmenu{position:absolute;right:14px;top:calc(120px + env(safe-area-inset-top,0px));background:var(--panel-bg);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:6px;display:none;z-index:3}
.cl-sortmenu.open{display:block}
.cl-sortmenu button{display:block;width:100%;border:none;background:transparent;color:var(--text);font-size:15px;padding:12px 16px;text-align:left;cursor:pointer;font-family:inherit}
.cl-tabs{display:flex;gap:8px;padding:6px 14px 10px;overflow-x:auto}
.cl-tab{border:1px solid var(--border);background:var(--panel-bg);color:var(--text);border-radius:20px;padding:9px 16px;font-size:14.5px;white-space:nowrap;cursor:pointer;font-family:inherit}
.cl-tab.on{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}
.cl-table-wrap{flex:1;overflow:auto;margin:0 14px;border:1px solid var(--border);border-radius:14px;background:var(--panel-bg)}
.cl-table{width:100%;min-width:640px;border-collapse:collapse;font-size:14px;color:var(--text)}
.cl-table th{position:sticky;top:0;background:var(--icon-hover);text-align:left;font-weight:600;padding:12px 10px;white-space:nowrap;font-size:13.5px}
.cl-table td{padding:12px 10px;border-top:1px solid var(--border);white-space:nowrap}
.cl-type svg{width:19px;height:19px}
.cl-type.in{color:#16a34a}.cl-type.out{color:#16a34a}.cl-type.miss{color:#dc2626}
.cl-det{border:none;background:#1d4ed8;color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.cl-empty{padding:50px 20px;text-align:center;color:var(--text-muted);font-size:15px}
.cl-pager{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px))}
.cl-pg{min-width:36px;height:36px;border:none;border-radius:8px;background:var(--panel-bg);color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;padding:0 6px;border:1px solid var(--border)}
.cl-pg.on{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}
.cl-pg:disabled{opacity:.4;cursor:default}
.cl-dots{color:var(--text-muted);padding:0 4px}
.cl-detail{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:261;display:none;align-items:center;justify-content:center;padding:24px}
.cl-detail.open{display:flex}
.cl-detail-box{background:var(--panel-bg);border-radius:22px;width:100%;max-width:360px;padding:22px 22px 16px}
.cl-detail-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:12px}
.cl-drow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--border);font-size:15px}
.cl-drow span:first-child{color:var(--text-muted)}
.cl-drow span:last-child{color:var(--text);text-align:right}
.cl-detail-close{width:100%;margin-top:12px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:26px;padding:13px 0;font-size:16px;cursor:pointer;font-family:inherit}
.pill-menu{position:fixed;background:var(--panel-bg);border:1px solid var(--border);border-radius:20px;box-shadow:0 10px 36px rgba(0,0,0,.2);padding:6px;display:none;flex-direction:column;z-index:120;min-width:230px}
.pill-menu.open{display:flex}
.pill-menu-item{display:flex;align-items:center;gap:18px;border:none;background:transparent;color:var(--text);font-size:17px;padding:14px 16px;border-radius:14px;cursor:pointer;font-family:inherit;text-align:left;width:100%}
.pill-menu-item:active{background:var(--icon-hover)}
.pill-menu-item svg{width:24px;height:24px;color:var(--text-soft);flex-shrink:0}
.topbar-pill svg.pi{display:none;width:22px;height:22px;flex-shrink:0}
.topbar-pill[data-mode="idle"] .pi-star,.topbar-pill[data-mode="call-in"] .pi-phone,.topbar-pill[data-mode="call-active"] .pi-hang,.topbar-pill[data-mode="music"] .pi-bars{display:block}
.topbar-pill[data-mode="call-in"]{color:#16a34a}
.topbar-pill[data-mode="call-active"]{color:#dc2626}
.topbar-pill[data-mode="music"]{color:#059669}
.topbar-pill{max-width:calc(100vw - 150px)}
.topbar-pill-text{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-pill-text:empty{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:transparent;flex-shrink:0;position:relative;z-index:20}
.icon-btn{border:none;background:var(--icon-circle-bg);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:var(--text);transition:background .2s,color .2s,transform .15s;flex-shrink:0}
.icon-btn:hover{background:var(--border);transform:scale(1.06)}
.icon-btn svg{width:19px;height:19px}
.right-icons{display:flex;align-items:center;gap:8px}
.search-replaces-topbar{position:fixed;top:0;left:0;right:0;height:58px;background:var(--page-bg);z-index:30;display:none;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.search-replaces-topbar.open{display:flex}
.search-replaces-topbar svg.ico{width:18px;height:18px;color:var(--text-muted);flex-shrink:0}
.search-replaces-topbar input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;color:var(--text);font-family:inherit;padding:6px 4px}
.search-replaces-topbar input::placeholder{color:var(--text-muted)}
.search-replaces-topbar .inchat-count{font-size:12.5px;color:var(--text-muted);flex-shrink:0}
.search-replaces-topbar .icon-btn{width:36px;height:36px;flex-shrink:0}
.chat-panel{position:fixed;top:0;left:0;bottom:0;width:min(320px,84vw);background:var(--panel-bg);box-shadow:var(--panel-shadow);display:flex;flex-direction:column;overflow:hidden;z-index:40;transform:translateX(-100%);transition:transform .28s cubic-bezier(.22,1,.36,1),background .3s}
.chat-panel.open{transform:translateX(0)}
.chat-panel-header{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-panel-title{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.4px}
.chat-panel-header-search{display:none;align-items:center;gap:8px;padding:14px 16px 8px;flex-shrink:0}
.chat-panel-header-search.open{display:flex}
.chat-panel-header-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;color:var(--text);font-family:inherit;padding:4px 0}
.chat-panel-header-search input::placeholder{color:var(--text-muted)}
.chat-panel-header-search .icon-btn{width:32px;height:32px;flex-shrink:0}
.drawer-nav-section{display:flex;flex-direction:column;padding:4px 8px;gap:2px}
.drawer-nav-section::after{content:'';display:block;height:1px;background:var(--border);margin:10px 10px 4px;flex-shrink:0}
.drawer-nav-item{display:flex;align-items:center;gap:14px;border:none;background:transparent;padding:13px 10px;border-radius:10px;font-size:17px;font-weight:400;color:var(--text);cursor:pointer;text-align:left;width:100%;transition:background .12s}
.drawer-nav-item:hover{background:var(--icon-hover)}
.drawer-nav-item:active{background:var(--border)}
.drawer-nav-icon-tile{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
.drawer-nav-icon-tile svg{width:26px;height:26px;stroke-width:1.9}
.chat-panel-subheader{padding:16px 18px 6px;font-size:14px;font-weight:600;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between}
.chat-panel-subheader .archived-toggle{font-size:12.5px;font-weight:600;color:var(--accent);background:transparent;border:none;cursor:pointer;padding:4px 8px;border-radius:8px;font-family:inherit}
.chat-list{list-style:none;margin:0;padding:4px 8px 8px 8px;overflow-y:auto;flex:1}
.chat-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:2px}
.all-chats-link{display:flex;align-items:center;gap:6px;padding:14px 14px 10px 14px;color:var(--text-muted);font-size:16px;cursor:pointer;list-style:none}
.all-chats-link svg{width:18px;height:18px}
.chat-list li.all-chats-link:hover{background:transparent}
.chat-bubble-icon{width:14px;height:14px;flex-shrink:0;color:var(--text-muted);display:flex;margin-right:4px}
.chat-bubble-icon svg{width:14px;height:14px}
.chat-all-link{display:flex;align-items:center;gap:4px;justify-content:flex-start !important;color:var(--text-muted);font-size:15px;padding:12px 14px;cursor:pointer;list-style:none}
.chat-all-link svg{width:16px;height:16px}
.all-chats-right{display:flex;gap:0}
.ac-search{display:flex;align-items:center;gap:10px;margin:6px 16px 8px;border:1px solid var(--border);border-radius:16px;background:var(--panel-bg);padding:0 14px;height:54px}
.ac-search svg{width:24px;height:24px;color:var(--text-soft);flex-shrink:0}
.ac-search input{flex:1;border:none;outline:none;background:transparent;font-size:18px;color:var(--text);font-family:inherit;min-width:0}
.ac-filter-pop{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:56px;background:var(--panel-bg);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:none;flex-direction:column;z-index:4;min-width:150px}
.ac-filter-pop.open{display:flex}
.ac-filter-pop button{border:none;background:transparent;color:var(--text);font-size:17px;padding:13px 16px;text-align:left;cursor:pointer;font-family:inherit;border-radius:10px}
.ac-filter-pop button.on{font-weight:600}
.ac-text{flex:1;min-width:0}
.ac-time{font-size:14px;color:var(--text-muted);margin-top:2px}
.ac-empty{text-align:center;color:var(--text-soft);padding:60px 20px;font-size:16px}
.ac-newchat{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border:none;border-radius:26px;background:#0d0d0f;color:#ffffff;font-size:15.5px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28)}
[data-theme="dark"] .ac-newchat{background:#ffffff;color:#0d0d0f}
.ac-newchat svg{width:20px;height:20px}
.all-chats-ul li{align-items:flex-start;padding:12px 10px}
.all-chats-ul .chat-bubble-icon{margin-top:5px}
.all-chats-page{position:fixed;inset:0;background:var(--bg);z-index:85;display:none;flex-direction:column}
.all-chats-page.open{display:flex}
.all-chats-top{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 10px}
.all-chats-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text);cursor:pointer;padding:0}
.all-chats-back svg{width:24px;height:24px}
.all-chats-title{font-size:20px;font-weight:600;color:var(--text)}
.all-chats-list{flex:1;overflow-y:auto;padding:4px 10px 20px}
.all-chats-ul{list-style:none;margin:0;padding:0}
.chat-item-popup-menu{z-index:200 !important}
.chat-list li:hover{background:var(--icon-hover)}
.chat-more-btn{width:34px;height:34px;border:none;background:transparent;color:var(--text-soft);display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;padding:0;flex-shrink:0;margin:-6px -6px -6px 0}
.chat-more-btn svg{width:22px;height:22px}
.chat-list li.active{background:var(--icon-hover)}
.chat-list .chat-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;font-weight:400;color:var(--text)}
.chat-spinner{width:18px;height:18px;flex-shrink:0;border:2px solid var(--text);border-top-color:transparent;border-radius:50%;animation:chatSpin .8s linear infinite}
@keyframes chatSpin{to{transform:rotate(360deg)}}
.empty-list{padding:24px 16px;font-size:13px;color:var(--text-muted);text-align:center}
.chat-select-checkbox{width:17px;height:17px;flex-shrink:0;accent-color:var(--accent)}
.chat-pin-icon{width:15px;height:15px;flex-shrink:0;color:var(--accent);display:flex}
.chat-pin-icon svg{width:100%;height:100%}
.chat-archive-icon{width:14px;height:14px;flex-shrink:0;color:var(--text-muted);display:flex}
.chat-archive-icon svg{width:100%;height:100%}
.drawer-chat-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin:12px auto calc(16px + env(safe-area-inset-bottom,0px)) 16px;padding:13px 22px;border:none;border-radius:26px;background:#0d0d0f;color:#ffffff;font-size:15.5px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28);transition:background .15s, transform .12s;flex-shrink:0;align-self:flex-start;width:fit-content}
.drawer-chat-btn:hover{background:#1f1f24}
.drawer-chat-btn:active{transform:scale(.97);opacity:1}
.drawer-chat-btn svg{width:18px;height:18px;stroke-width:2}
[data-theme="dark"] .drawer-chat-btn{background:#ffffff;color:#0d0d0f}
[data-theme="dark"] .drawer-chat-btn:hover{background:#e5e5e5}
.section-page-overlay{position:fixed;inset:0;background:var(--page-bg);z-index:80;display:none;flex-direction:column}
.section-page-overlay.open{display:flex}
.section-page-title{font-size:16px;font-weight:700;color:var(--text)}
.section-page-body{flex:1;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.section-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}
@media(min-width:520px){.section-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.section-grid{grid-template-columns:repeat(4,1fr)}}
.section-card{display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.section-card-media{width:100%;aspect-ratio:1/1;border-radius:12px;background:var(--icon-hover);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.section-card-media img,.section-card-media video{width:100%;height:100%;object-fit:cover;display:block}
.section-card-file-icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-soft)}
.section-card-file-icon svg{width:38%;height:38%}
.section-card-name{font-size:12px;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;width:100%}
#mainTopbar .icon-btn{width:44px;height:44px}
#mainTopbar .icon-btn svg{width:23px;height:23px}
.topbar-menu{position:fixed;top:56px;right:12px;min-width:240px;background:var(--panel-bg);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.06);padding:6px;display:none;flex-direction:column;z-index:100;animation:topbarMenuIn .15s ease}
@keyframes topbarMenuIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.topbar-menu.open{display:flex}

/* ═══════════════════════════════════════════════
   VOICE SPEAKING STATES — GREEN + PULSE ANIMATION
   ═══════════════════════════════════════════════ */
@keyframes voicePulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(16,163,127,.55); transform:scale(1); }
  50%    { box-shadow:0 0 0 10px rgba(16,163,127,0); transform:scale(1.06); }
}
/* Detail page (App detail) voice button */
#detailVoiceBtn.speaking{
  background:var(--accent) !important;
  color:#ffffff !important;
  border-color:var(--accent) !important;
  animation:voicePulse 1.2s ease-in-out infinite;
}
#detailVoiceBtn.speaking svg{stroke:currentColor;}
#detailVoiceBtn.speaking{background:transparent !important;color:inherit !important;border-color:transparent !important;animation:none !important}
#detailVoiceBtn .ico-pause{display:none}
#detailVoiceBtn.speaking .ico-speak{display:none}
#detailVoiceBtn.speaking .ico-pause{display:block}
/* Permission page voice FAB */
.voice-fab.speaking{
  background:var(--accent) !important;
  color:#ffffff !important;
  border-color:var(--accent) !important;
  animation:voicePulse 1.2s ease-in-out infinite;
}
.voice-fab.speaking svg{stroke:#ffffff;}
/* AI message listen button */
.msg-action-btn.speaking{
  color:var(--accent) !important;
  background:var(--accent-soft) !important;
  animation:voicePulse 1.2s ease-in-out infinite;
}
