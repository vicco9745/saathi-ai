name: add-format
on:
  push:
    paths:
      - 'index.html'
      - 'site_patches/**'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_all.py
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -am "auto apply all site patches"
            git push
          fi
